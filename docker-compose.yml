# docker compose up                      the API with SQLite, on http://localhost:8000
# docker compose --profile postgres up   the API on Postgres with pgvector, on http://localhost:8001
services:
  api:
    build: .
    ports: ["8000:8000"]
    env_file:
      - path: .env
        required: false
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg16
    profiles: ["postgres"]
    environment:
      POSTGRES_PASSWORD: cardpilot
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  api-postgres:
    build: .
    profiles: ["postgres"]
    ports: ["8001:8000"]
    env_file:
      - path: .env
        required: false
    environment:
      CARDPILOT_STORE: postgres
      CARDPILOT_DATABASE_URL: postgresql://postgres:cardpilot@db:5432/postgres
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
